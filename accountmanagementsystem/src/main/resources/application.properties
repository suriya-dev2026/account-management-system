server.port = 8080
server.servlet.context-path=/user-auth
spring.application.name = accountmanagementsystem

spring.datasource.driver-class-name = org.postgresql.Driver
spring.datasource.url = jdbc:postgresql://localhost:5432/ams
spring.datasource.username = postgres
spring.datasource.password = {{DB_PASSWORD}}

spring.jpa.hibernate.ddl-auto = none
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

#authtoken config
authtoken.refreshkeyvalidity.days = 1
authtoken.tokenvalidity.seconds = 600
authtoken.signing.key = {{JWT_SECRET}}
authtoken.prefix = Bearer
authtoken.tokenname = Authorization
authtoken.issuer = 

#smtp config
spring.mail.host = smtp.gmail.com
spring.mail.port = 587
spring.mail.username = suriyasundar2021@gmail.com
spring.mail.password = {{MAIL_PASSWORD}}
spring.mail.properties.mail.smtp.auth = true
spring.mail.properties.mail.smtp.starttls.enable = true

spring.flyway.baseline-on-migrate = true

spring.data.redis.host=localhost
spring.data.redis.port=6379


